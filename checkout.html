<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Checkout | MAN MODE</title><link rel="stylesheet" href="style.css?v=20261107-4"><style>
.checkout-wrap{max-width:900px;margin:auto;padding:60px 6% 90px}.checkout-wrap h1{font:800 clamp(38px,7vw,62px)/1.1 Manrope,sans-serif;margin:10px 0 28px}.checkout-layout{display:grid;grid-template-columns:1fr 300px;gap:25px}.checkout-form,.checkout-summary{background:#191919;padding:24px}.checkout-form label{display:block;margin:14px 0 7px;font-size:12px;color:#ddd}.checkout-form input,.checkout-form textarea{width:100%;padding:13px;background:#090909;border:1px solid #444;color:white;font:inherit;border-radius:2px}.checkout-form textarea{min-height:95px;resize:vertical}.checkout-form button{width:100%;padding:16px;margin-top:22px;background:#c6a36b;color:#111;border:0;font-weight:800;cursor:pointer}.checkout-form button:disabled{opacity:.6}.checkout-summary h2{font:700 17px Manrope,sans-serif;margin-bottom:16px}.checkout-summary p{display:flex;justify-content:space-between;gap:10px;margin:12px 0;color:#ddd;font-size:13px}.checkout-summary .total{border-top:1px solid #444;padding-top:15px;font-weight:800;color:white}.message{margin-top:15px;color:#e8c98e;font-size:13px;line-height:1.6}.message.error{color:#ff9a9a}@media(max-width:700px){.checkout-layout{grid-template-columns:1fr}.checkout-summary{order:-1}}
</style></head><body><div class="announcement">A NEW POINT OF VIEW ON EVERYDAY STYLE</div><header class="site-header"><a class="brand-lockup" href="index.html"><span class="brand-name">MAN MODE</span></a><nav class="main-nav"><a href="index.html">HOME</a><a href="products.html">SHOP</a><a href="cart.html">CART</a></nav></header><main class="checkout-wrap"><p class="eyebrow">ALMOST YOURS</p><h1>CHECKOUT.</h1><div class="checkout-layout"><form class="checkout-form" id="checkoutForm"><label for="customerName">Full name</label><input id="customerName" name="customerName" autocomplete="name" minlength="2" required><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" pattern="[0-9+() -]{7,20}" placeholder="01XXXXXXXXX" required><label for="address">Full delivery address</label><textarea id="address" name="address" autocomplete="street-address" minlength="5" required></textarea><label for="district">District</label><input id="district" name="district" autocomplete="address-level2" minlength="2" required><button id="placeOrder" type="submit">PLACE ORDER · CASH ON DELIVERY</button><p id="checkoutMessage" class="message" role="status"></p></form><aside class="checkout-summary" id="checkoutSummary"><h2>YOUR ORDER</h2><div id="checkoutItems"></div><p class="total"><span>Total</span><strong id="checkoutTotal">৳ 0</strong></p><small style="color:#aaa">Delivery charge, if applicable, will be confirmed by the store.</small></aside></div></main><footer class="site-footer"><div class="footer-top"><a class="footer-brand" href="index.html">MAN MODE®</a><p>YOUR STYLE. YOUR RULES.</p></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="cart.js"></script><script src="checkout.js?v=delivery-zones-20261107-1"></script></body></html>
