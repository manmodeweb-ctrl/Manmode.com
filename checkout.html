 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | MAN MODE</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-page {
            max-width: 750px;
            margin: auto;
            padding: 65px 20px;
        }

        .checkout-page h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 48px;
            margin-bottom: 30px;
        }

        .checkout-form {
            background: #141414;
            padding: 30px;
        }

        .checkout-form label {
            display: block;
            margin: 18px 0 8px;
            font-size: 13px;
        }

        .checkout-form input,
        .checkout-form textarea {
            width: 100%;
            padding: 14px;
            background: #090909;
            border: 1px solid #333;
            color: white;
            font: inherit;
        }

        .checkout-form textarea {
            min-height: 100px;
        }

        .checkout-form button {
            margin-top: 25px;
            width: 100%;
            padding: 16px;
            background: #c9a46a;
            color: #090909;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">MAN<span>MODE.</span></a>
    <nav>
        <a href="index.html">HOME</a>
        <a href="products.html">SHOP</a>
        <a href="cart.html">CART</a>
    </nav>
</header>

<main class="checkout-page">
    <p class="eyebrow">ALMOST YOURS</p>
    <h1>CHECKOUT.</h1>

    <form class="checkout-form" id="checkoutForm">

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Phone Number</label>
        <input type="tel" placeholder="01XXXXXXXXX" required>

        <label>Delivery Address</label>
        <textarea placeholder="Enter your full address" required></textarea>

        <label>City / District</label>
        <input type="text" placeholder="Enter your district" required>

        <button type="submit">PLACE ORDER</button>

        <p id="checkoutMessage"></p>
    </form>
</main>

<footer>
    <a href="index.html" class="logo">MAN<span>MODE.</span></a>
    <p>YOUR STYLE. YOUR RULES.</p>
</footer>

<script>
document.getElementById("checkoutForm").addEventListener("submit", function(e) {
    e.preventDefault();
    document.getElementById("checkoutMessage").textContent =
        "Thank you! Checkout interface is ready. Order processing will be connected later.";
});
</script>

</body>
</html>
