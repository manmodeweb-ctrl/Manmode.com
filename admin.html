
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAN MODE | Admin Dashboard</title>
<link rel="stylesheet" href="style.css">

<style>
.admin-layout {
    display: grid;
    grid-template-columns: 230px 1fr;
    min-height: 100vh;
}

.sidebar {
    background: #111;
    padding: 30px 20px;
    border-right: 1px solid #292929;
}

.sidebar h2 {
    font-family: 'Oswald', sans-serif;
    margin-bottom: 35px;
}

.sidebar a {
    display: block;
    padding: 14px;
    color: #aaa;
    margin-bottom: 8px;
}

.sidebar a:hover {
    background: #222;
    color: #c9a46a;
}

.dashboard {
    padding: 35px;
}

.dashboard h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 38px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin: 30px 0;
}

.stat-card {
    background: #171717;
    padding: 25px;
}

.stat-card p {
    color: #999;
    margin-bottom: 15px;
}

.stat-card h2 {
    color: #c9a46a;
    font-size: 28px;
}

.admin-panel {
    background: #171717;
    padding: 25px;
    margin-top: 25px;
}

.admin-panel h2 {
    font-family: 'Oswald', sans-serif;
    margin-bottom: 20px;
}

.admin-panel input,
.admin-panel textarea,
.admin-panel select {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    background: #090909;
    border: 1px solid #333;
    color: white;
}

.admin-panel button {
    padding: 14px 25px;
    background: #c9a46a;
    border: none;
    font-weight: bold;
}

@media(max-width:700px) {
    .admin-layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
    }

    .sidebar h2 {
        width: 100%;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .dashboard {
        padding: 20px;
    }
}
</style>
</head>

<body>

<div class="admin-layout">

<aside class="sidebar">
    <h2>MAN<span style="color:#c9a46a">MODE.</span></h2>
    <a href="admin.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="index.html">View Website</a>
    <a href="checkout.html">Checkout</a>
</aside>

<main class="dashboard">

    <p class="eyebrow">CONTROL CENTER</p>
    <h1>ADMIN DASHBOARD</h1>

    <div class="stats">
        <div class="stat-card">
            <p>Total Products</p>
            <h2>0</h2>
        </div>

        <div class="stat-card">
            <p>Total Orders</p>
            <h2>0</h2>
        </div>

        <div class="stat-card">
            <p>Total Revenue</p>
            <h2>৳0</h2>
        </div>
    </div>

    <section class="admin-panel">
        <h2>ADD NEW PRODUCT</h2>

        <form id="productForm">

            <input type="text" placeholder="Product Name" required>

            <input type="number" placeholder="Product Price" required>

            <select required>
                <option value="">Select Category</option>
                <option>Clothing</option>
                <option>Footwear</option>
                <option>Accessories</option>
                <option>Lifestyle</option>
            </select>

            <textarea placeholder="Product Description"></textarea>

            <button type="submit">ADD PRODUCT</button>

        </form>
    </section>

</main>
</div>

<script>
document.getElementById("productForm").addEventListener("submit", function(e) {
    e.preventDefault();
    alert("Admin interface ready! Product database will be connected in the next stage.");
});
</script>

</body>
</html>
