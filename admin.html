
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAN MODE | Admin Dashboard</title>
<link rel="stylesheet" href="style.css">

<style>
body { background:#090909; color:white; }
.admin-layout { display:grid; grid-template-columns:220px 1fr; min-height:100vh; }
.sidebar { background:#111; padding:25px; border-right:1px solid #333; }
.sidebar h2 { margin-bottom:35px; }
.sidebar a { display:block; padding:13px; color:#aaa; text-decoration:none; }
.dashboard { padding:30px; }
.dashboard h1 { font-size:32px; }
.admin-panel { background:#171717; padding:25px; margin-top:25px; max-width:750px; }
.admin-panel input:not([type=checkbox]),
.admin-panel textarea,
.admin-panel select {
 width:100%; padding:14px; margin:10px 0;
 background:#090909; border:1px solid #444; color:white;
 box-sizing:border-box;
}
.admin-panel input[type=file] { padding:12px; }
.admin-panel label { display:block; margin-top:15px; }
.admin-panel button {
 padding:14px 25px; margin-top:20px;
 background:#c9a46a; border:0; font-weight:bold;
 cursor:pointer;
}
#status { margin-top:15px; color:#c9a46a; }
@media(max-width:700px) {
 .admin-layout { grid-template-columns:1fr; }
 .sidebar { display:flex; flex-wrap:wrap; gap:10px; }
 .sidebar h2 { width:100%; }
 .dashboard { padding:18px; }
}
</style>
</head>

<body>
<div class="admin-layout">

<aside class="sidebar">
<h2>MAN<span style="color:#c9a46a">MODE.</span></h2>
<a href="admin.html">Dashboard</a>
<a href="products.html">Products</a>
<a href="index.html">View Website</a>
</aside>

<main class="dashboard">
<p>CONTROL CENTER</p>
<h1>ADMIN DASHBOARD</h1>

<section class="admin-panel">
<h2>ADD NEW PRODUCT</h2>

<form id="productForm">

<label>Product Name</label>
<input type="text" id="productName" required>

<label>Product Price</label>
<input type="number" id="productPrice" min="0" required>

<label>Old Price</label>
<input type="number" id="oldPrice" min="0">

<label>Category</label>
<select id="productCategory" required>
<option value="">Select Category</option>
<option>Clothing</option>
<option>Footwear</option>
<option>Accessories</option>
<option>Lifestyle</option>
</select>

<label>Description</label>
<textarea id="productDescription"></textarea>

<label>Stock Quantity</label>
<input type="number" id="productStock" min="0" value="1" required>

<label>Upload Product Images</label>
<input type="file" id="productImages" accept="image/*" multiple required>

<label>
<input type="checkbox" id="productFeatured">
Featured Product
</label>

<label>
<input type="checkbox" id="productActive" checked>
Active Product
</label>

<button type="submit">ADD PRODUCT</button>

<p id="status"></p>
</form>
</section>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
