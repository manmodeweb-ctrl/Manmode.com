
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | MAN MODE</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-page {
            padding: 70px 7%;
            min-height: 60vh;
        }

        .cart-page h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 50px;
            margin-bottom: 30px;
        }

        .cart-empty {
            padding: 45px;
            background: #141414;
            text-align: center;
        }

        .cart-empty p {
            color: #aaa;
            margin: 15px 0 25px;
        }

        .cart-btn {
            display: inline-block;
            background: #c9a46a;
            color: #090909;
            padding: 15px 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">MAN<span>MODE.</span></a>
    <nav>
        <a href="index.html">HOME</a>
        <a href="products.html">SHOP</a>
        <a href="cart.html">CART</a>
    </nav>
</header>

<main class="cart-page">
    <p class="eyebrow">YOUR SELECTION</p>
    <h1>SHOPPING CART.</h1>

    <div class="cart-empty">
        <h2>Your cart is waiting.</h2>
        <p>Discover something that defines your style.</p>
        <a href="products.html" class="cart-btn">
            CONTINUE SHOPPING ↗
        </a>
    </div>
</main>

<footer>
    <a href="index.html" class="logo">MAN<span>MODE.</span></a>
    <p>YOUR STYLE. YOUR RULES.</p>
</footer>

</body>
</html>
